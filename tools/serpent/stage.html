<!doctype html><html><head><meta charset="utf-8"><title>serpent stage</title>
<style>html,body{margin:0;background:#000;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "../../vendor/three/three.module.js" } }</script></head>
<body><script type="module">
// The fire serpent alone on a plain field (no world): its shape at a glance — tools/serpent-stage.mjs takes the shots.
import * as THREE from 'three';
import { FireSerpent } from '../../src/game/FireSerpent.js';
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb6d8);
scene.fog = new THREE.Fog(0x8fb6d8, 150, 600);
const cam = new THREE.PerspectiveCamera(60, W / H, 0.5, 2000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445533, 0.9));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshLambertMaterial({ color: 0x5a7a3a }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const me = new THREE.Vector3(0, 2, 0);
const hero = new THREE.Mesh(new THREE.BoxGeometry(1, 3.5, 1), new THREE.MeshLambertMaterial({ color: 0x3355aa })); hero.position.set(0, 1.75, 0); scene.add(hero);
const game = {
    scene, localId: 'me', authority: true, collision: { groundY: () => 0 },
    character: { group: { position: me } },
    combat: { enabled: true, fatigue: 900, check: () => null, pay() {} },
    hellfire: { state: { c: new THREE.Vector3(10, 0.5, 10), d: new THREE.Vector3(1, 0, 0.3), k: 0 }, _burn: () => false, _wet: () => 0, _worked() {} },
    fx: null, sound: null, hud: null, castleLife: null,
};
const fs = new FireSerpent(game);
fs.cast(true);
window.__S = { THREE, fs, game, cam, renderer, scene, step(n, dt = 1 / 30) { for (let i = 0; i < n; i++) fs.update(dt); }, draw() { renderer.render(scene, cam); } };
window.__ready = true;
</script></body></html>
