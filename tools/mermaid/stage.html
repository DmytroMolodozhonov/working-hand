<!doctype html><html><head><meta charset="utf-8"><title>mermaid stage</title>
<style>html,body{margin:0;background:#000;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "../../vendor/three/three.module.js" } }</script></head>
<body><script type="module">
// The hero with the mermaid's tail (Mermaid.attachTail) alone on a plain stage: its look from every side — tools/mermaid-stage.mjs.
import * as THREE from 'three';
import { VoxelCharacter } from '../../src/entities/Character.js';
import { attachTail } from '../../src/game/Mermaid.js';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a7fa8);
scene.add(new THREE.HemisphereLight(0xd8f0ff, 0x204050, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(5, 10, 6); scene.add(sun);
const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
const ch = new VoxelCharacter(scene, { remote: true });
ch.group.position.set(0, 0, 0);
const M = window.__M = { THREE, scene, cam, ch, tail: null, draw() { renderer.render(scene, cam); },
    use(type, hue) { M.tail?.dispose(); M.tail = attachTail(ch, { type, hue }); M.tail.set(true, 0); } };
M.use('classic', 0.5);
window.__ready = true;
</script></body></html>
