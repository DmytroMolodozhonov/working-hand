<!doctype html><html><head><meta charset="utf-8"><title>cut stage</title>
<style>html,body{margin:0;background:#000;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "../../vendor/three/three.module.js" } }</script></head>
<body><script type="module">
// Cuts on a villager (LimbSurgery + CutBodies, as a blade cuts) and the «Пилбидрио» burst: tools/cut-stage.mjs takes the shots.
import * as THREE from 'three';
import { VillagerModel, villagerLook } from '../../src/entities/VillagerModel.js';
import { villagerBody } from '../../src/game/CutBodies.js';
import { cutLimb } from '../../src/entities/LimbSurgery.js';
import { StrongMagic } from '../../src/game/StrongMagic.js';
import { ParticlePool } from '../../src/fx/Particles.js';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9cc4e4);
scene.add(new THREE.HemisphereLight(0xffffff, 0x556644, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(4, 8, 6); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshLambertMaterial({ color: 0x7a9a5a })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
let m = null; const pieces = [];
window.__C = {
    THREE, cam, scene,
    reset(seed = 3, role = 'farmer', far = false) {
        if (m) scene.remove(m.group);
        for (const p of pieces) scene.remove(p); pieces.length = 0;
        m = new VillagerModel(villagerLook(seed, role), {}); scene.add(m.group);
        m.group.position.set(0, 1.95, 0); m.update(0.016, { mode: 'idle', speed: 0 }); this.far = far; if (far) m.setFar(true); m.group.updateMatrixWorld(true);
    },
    cut(name, d, n = null) {
        const r = cutLimb(m, villagerBody(m), name, d, n, { piece: true });
        m.setFar(this.far); // (as the game asks every frame — refused while it is cut)
        if (r.piece) { scene.add(r.piece); pieces.push(r.piece); }
        return { changed: r.changed, piece: !!r.piece };
    },
    // the pieces beside him as they were cut (moved aside, upright as they hung on him)
    layPieces() { let i = 0; for (const p of pieces) { p.position.x += 2.4 + i * 1.3; i++; } },
    anim(t = 0.5) { for (let k = 0; k < t * 30; k++) { m.update(1 / 30, { mode: 'idle', speed: 0 }); if (this.far) m.setFar(true); } },
    shot(ang = 0.5, dist = 9, h = 2) { cam.position.set(Math.sin(ang) * dist, h, Math.cos(ang) * dist); cam.lookAt(0.6, 1.6, 0); m.group.updateMatrixWorld(true); renderer.render(scene, cam); },
};
function far() { return false; }
// «Пилбидрио»: the burst of the game (StrongMagic.burstParts + burstLook), its pieces flying (SeveredPart), the debris and blood
const debris = new ParticlePool(scene, { geometry: new THREE.BoxGeometry(1, 1, 1), capacity: 400, lit: true, gravity: -14, ground: () => 0, bounce: 0.3 });
const sparks = new ParticlePool(scene, { geometry: new THREE.BoxGeometry(1, 1, 1), capacity: 600, transparent: true, gravity: -6 });
const game = { scene, collision: { groundY: () => 0, groundAt: () => 0 }, dismember: { which: () => ({ k: 'v', body: villagerBody(m) }) },
    fx: { lightFlash() {}, debris, blood: (p, n) => { for (let i = 0; i < n; i++) sparks.spawn(p.x, p.y, p.z, (Math.random() - 0.5) * 6, Math.random() * 6, (Math.random() - 0.5) * 6, 0x9a0010, 0.12, 1.2); },
        spark: (p, c, sz, v, life) => sparks.spawn(p.x, p.y, p.z, v.x, v.y, v.z, c, sz, life) } };
const SM = new StrongMagic(game);
window.__C.burst = function () {
    const p = new THREE.Vector3(0, 2, 0);
    const n = SM.burstParts('v', { model: m, group: m.group }, p, 1.3, 'flesh');
    SM.burstLook(p, 1.3, 'flesh', n);
    m.group.visible = false; // (the creature itself is gone: _vanish)
    return n;
};
window.__C.run = function (t) { for (let k = 0; k < t * 60; k++) { for (const pr of game.dismember.props || []) pr.step(1 / 60); debris.update(1 / 60); sparks.update(1 / 60); } };
window.__ready = true;
</script></body></html>
