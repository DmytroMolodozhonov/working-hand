<!doctype html>
<html><head><meta charset="utf-8"><title>titan preview</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js" } }</script>
</head><body>
<script type="module">
// tools/titan-preview.mjs drives this page: window.__shoot(id, view) → a PNG data URL of that titan on its planet's ground.
import * as THREE from 'three';
import { titanModel, poseWalker, titanSite } from '../src/game/TitanModels.js';
import { TITANS } from '../src/game/TitanRules.js';

const W = 960, H = 540;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
// each planet: its sky, its ground, its light (roughly as the game's Space._planetSky)
const PLANET = {
    mercury: { sky: 0x05060a, fog: 0x05060a, ground: 0x8f8a84, sun: 0xffffff, sunI: 2.6, amb: 0.18 },
    venus: { sky: 0xe8c58a, fog: 0xd8a868, ground: 0x6a4630, sun: 0xffe2b0, sunI: 1.4, amb: 0.55 },
    mars: { sky: 0xd8a27a, fog: 0xc88a62, ground: 0xc1562e, sun: 0xfff0e0, sunI: 1.8, amb: 0.4 },
    jupiter: { sky: 0xd8b48a, fog: 0xc89a6a, ground: 0xc8a070, sun: 0xfff4e0, sunI: 1.5, amb: 0.5 },
    saturn: { sky: 0xe6d4a6, fog: 0xd8c08a, ground: 0xcfb582, sun: 0xfff6e0, sunI: 1.5, amb: 0.5 },
    uranus: { sky: 0x6fb8c2, fog: 0x5aa0aa, ground: 0x8ccdd6, sun: 0xe8f8ff, sunI: 1.1, amb: 0.45 },
    neptune: { sky: 0x2a4596, fog: 0x30509a, ground: 0x3e62c4, sun: 0xe0e8ff, sunI: 1.0, amb: 0.45 },
};
const scene = new THREE.Scene();
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.5); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
scene.add(sun, sun.target);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 1 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000, 80, 80), groundMat);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
{ const p = ground.geometry.attributes.position; for (let i = 0; i < p.count; i++) p.setZ(i, (Math.sin(p.getX(i) * 0.01) + Math.cos(p.getY(i) * 0.013)) * 3); ground.geometry.computeVertexNormals(); }
scene.add(ground);
const camera = new THREE.PerspectiveCamera(55, W / H, 1, 8000);
let current = null;

const models = new Map();
let site = null;
window.__shoot = (id, view, pose = null) => {
    const def = TITANS[id], P = PLANET[id];
    if (current) scene.remove(current);
    if (site) { scene.remove(site); site = null; }
    const m = models.get(id) || titanModel(def.look);
    models.set(id, m);
    current = m;
    scene.add(m);
    if (pose?.site) { site = titanSite(def.look); site.scale.setScalar(def.height); site.position.set(pose.site[0] * def.height, 0, pose.site[1] * def.height); scene.add(site); }
    m.traverse((o) => { if (o.isMesh) o.castShadow = true; });
    scene.background = new THREE.Color(P.sky);
    scene.fog = new THREE.Fog(P.fog, 600, 3500);
    groundMat.color.set(P.ground);
    hemi.color.set(P.sky); hemi.groundColor.set(P.ground); hemi.intensity = P.amb;
    sun.color.set(P.sun); sun.intensity = P.sunI;
    const Hh = def.height;
    sun.position.set(Hh * 1.2, Hh * 2, -Hh * 1.6); sun.target.position.set(0, 0, 0);
    const sc = sun.shadow.camera; sc.left = sc.bottom = -Hh * 1.5; sc.right = sc.top = Hh * 1.5; sc.far = Hh * 6; sc.updateProjectionMatrix();
    if (def.look === 'worm') {
        // the worm's rings along an arch out of the ground, as Titans._drawWorm lays them (risen, mouth open)
        const R = m.userData.rig, n = R.rings.length, thick = def.radius * 2, Hw = def.height * 0.38, len = n * thick * 0.42;
        for (let i = 0; i < n; i++) {
            const s = i / (n - 1), h = Hw * Math.max(0, Math.cos(s * Math.PI * 0.75)) - s * thick * 2;
            R.rings[i].position.set(0, h - thick * 0.3, s * len * 0.5);
            R.rings[i].scale.setScalar(thick);
            if (i) { const v = new THREE.Vector3().subVectors(R.rings[i - 1].position, R.rings[i].position); R.rings[i].quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), v.normalize()); }
            else R.rings[i].quaternion.setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0, 'YXZ'));
        }
        R.head.position.copy(R.rings[0].position).y += thick * 0.25; R.head.quaternion.copy(R.rings[0].quaternion); R.head.scale.setScalar(thick);
        for (const p of R.petals) p.rotation.x = -0.9 * 1.7;
    } else if (def.look === 'storm') {
        m.scale.setScalar(Hh);
        const mat = m.userData.stormMat; mat.userData.uT.value = 3.7;
    } else {
        m.scale.setScalar(Hh);
        poseWalker(m, pose || { ph: 0.9, k: 1, blow: 0.35, arm: 1, breathe: 1 });
        const R = m.userData.rig;
        for (const b of R.blades) b.visible = !!pose?.blades;
        for (const b of R.shell) b.visible = !!pose?.shell;
        if (R.club) R.club.visible = !!pose?.club;
        if (R.prop) R.prop.visible = !pose?.noProp;
        if (def.look === 'shade') m.traverse((o) => { if (o.material && o.material.transparent) o.material.opacity = 0.9; });
    }
    m.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(m), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
    const big = Math.max(sz.y, sz.x, sz.z);
    const at0 = view === 'close' ? new THREE.Vector3(c.x, box.max.y - sz.y * 0.18, c.z) : c;
    const at = at0; const d = view === 'close' ? big * 0.55 : big * 1.25;
    const a = view === 'front' ? Math.PI : view === 'three' ? Math.PI - 0.7 : view === 'side' ? Math.PI / 2 : Math.PI - 0.35; // (the bodies face −z)
    camera.position.set(at.x + Math.sin(a) * d, Math.max(4, at.y * (view === 'close' ? 1 : 0.55)), at.z + Math.cos(a) * d);
    camera.lookAt(at);
    renderer.render(scene, camera);
    return renderer.domElement.toDataURL('image/png');
};
window.__ready = true;
</script>
</body></html>
