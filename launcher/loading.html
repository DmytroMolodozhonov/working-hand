<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Волшебство только начинается</title>
<link rel="icon" href="/favicon.ico">
<style>
    :root {
        --bg1: #0b0820; --bg2: #1d1340; --gold: #f5c84c; --gold2: #ffe7a1; --text: #ece8ff;
        --dim: #a79fcf; --ok: #6ee7a8; --bad: #ff8a8a; --card: rgba(255, 255, 255, 0.06);
        --line: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
        background: radial-gradient(ellipse at 50% 35%, var(--bg2), var(--bg1) 70%);
        color: var(--text); font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    #stars { position: fixed; inset: 0; pointer-events: none; }
    .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: 0.2; animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 50% { opacity: 0.9; } }
    main { position: relative; width: min(560px, calc(100vw - 32px)); text-align: center; }
    .logo { width: 132px; height: 132px; filter: drop-shadow(0 0 24px rgba(245, 200, 76, 0.45)); animation: float 4s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-8px) rotate(-3deg); } }
    h1 { margin: 10px 0 2px; font-size: 1.9rem; font-weight: 700; letter-spacing: 0.5px;
        background: linear-gradient(90deg, var(--gold2), var(--gold), var(--gold2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #title { color: var(--dim); margin: 6px 0 22px; min-height: 1.4em; font-size: 1.05rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; text-align: left; backdrop-filter: blur(6px); }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; gap: 12px; padding: 7px 0; color: var(--dim); }
    li.run { color: var(--text); }
    li.ok { color: var(--text); }
    li .ic { width: 22px; height: 22px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--line); font-size: 13px; }
    li.ok .ic { border-color: var(--ok); color: var(--ok); }
    li.skip .ic { border-color: var(--line); color: var(--dim); }
    li.fail .ic { border-color: var(--bad); color: var(--bad); }
    li.run .ic { border-color: var(--gold); border-top-color: transparent; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    li .note { margin-left: auto; font-size: 0.85rem; color: var(--dim); text-align: right; }
    .bar { height: 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.08); overflow: hidden; margin-top: 14px; }
    .bar > div { height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, #b07cff, var(--gold)); transition: width 0.3s; }
    .bar.indet > div { width: 30%; animation: slide 1.4s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(360%); } }
    #detail { margin-top: 8px; font-size: 0.88rem; color: var(--dim); min-height: 1.2em; }
    #tip { margin-top: 18px; font-size: 0.9rem; color: var(--dim); min-height: 2.6em; transition: opacity 0.5s; }
    button { font: inherit; border-radius: 10px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.08); color: var(--text); }
    button.main { background: linear-gradient(180deg, var(--gold2), var(--gold)); color: #2a1a00; border: none; font-weight: 700; }
    button:hover { filter: brightness(1.1); }
    .row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    input[type=text] { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.3); color: var(--text); }
    .hint { color: var(--dim); font-size: 0.9rem; margin: 0 0 10px; }
    .err { color: var(--bad); margin-top: 10px; min-height: 1.2em; }
    pre { max-height: 40vh; overflow: auto; background: rgba(0, 0, 0, 0.4); border-radius: 10px; padding: 10px; font-size: 0.75rem; white-space: pre-wrap; text-align: left; }
    [hidden] { display: none !important; }
    /* the same window as the game's menu: no Windows frame and no strip on top — only three small
       buttons in the corner; the whole window drags it */
    html, body { cursor: grab; user-select: none; touch-action: none; }
    body.dragging { cursor: grabbing; }
    button, input { cursor: pointer; user-select: text; }
    input { cursor: text; }
    #winbtns { position: fixed; top: 12px; right: 12px; z-index: 5; display: flex; gap: 6px; }
    #winbtns button { width: 30px; height: 26px; padding: 0; border-radius: 9px; font-size: 13px; font-weight: 800;
        display: grid; place-items: center; color: var(--dim); background: rgba(255, 255, 255, 0.05); }
    #winbtns button:hover { color: var(--text); background: rgba(167, 139, 255, 0.2); border-color: #a78bff; }
    #winbtns button.x:hover { background: #d23a5c; border-color: #ff5d7a; color: #fff; }
    h1 { font-family: "Philosopher", Georgia, "Times New Roman", serif; }
</style>
</head>
<body>
<div id="stars"></div>
<div id="winbtns">
    <button id="win-min" title="Свернуть" aria-label="Свернуть">—</button>
    <button id="win-close" class="x" title="Закрыть" aria-label="Закрыть">✕</button>
</div>
<main>
    <img class="logo" src="/__launcher/logo.png" alt="" onerror="this.style.visibility='hidden'">
    <h1>Волшебство только начинается</h1>
    <div id="title">Готовлю игру…</div>

    <!-- the first launch: where to install -->
    <div id="folder" class="card" hidden>
        <p class="hint">Выберите папку, куда положить игру (около 400 МБ). Потом игра будет открываться сразу.</p>
        <input id="folder-path" type="text" spellcheck="false">
        <div class="row">
            <button id="browse">📁 Выбрать папку…</button>
            <button id="install" class="main">Установить сюда</button>
        </div>
        <div id="folder-err" class="err"></div>
    </div>

    <!-- the steps -->
    <div id="work" class="card" hidden>
        <ul id="steps"></ul>
        <div id="bar" class="bar indet"><div></div></div>
        <div id="detail"></div>
    </div>

    <!-- something went wrong -->
    <div id="error" class="card" hidden>
        <p id="error-text" class="err" style="margin-top:0"></p>
        <div class="row">
            <button id="retry" class="main">Попробовать ещё раз</button>
            <button id="show-log">Показать журнал</button>
        </div>
        <pre id="log" hidden></pre>
    </div>

    <div id="tip"></div>
</main>
<script>
(() => {
    const $ = (id) => document.getElementById(id);
    const ICON = { ok: '✓', fail: '!', skip: '–', wait: '', run: '' };
    const TIPS = [
        'Заклинания произносятся голосом — вслух и чётко.',
        'Встаньте так, чтобы камера видела вас по пояс и обе руки.',
        'Меч держится в кулаке: сожмите пальцы — и он у вас в руке.',
        'Предмет выпадет, только если вы сами разожмёте руку.',
        'Миры сохраняются сами — можно выйти и вернуться позже.',
        'В настройках есть «Журнал»: туда игра пишет, что с ней происходит.',
    ];
    // the stars
    const sky = $('stars');
    for (let i = 0; i < 90; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
        sky.appendChild(s);
    }
    let tip = Math.floor(Math.random() * TIPS.length);
    const nextTip = () => { $('tip').textContent = '✨ ' + TIPS[tip++ % TIPS.length]; };
    nextTip();
    setInterval(nextTip, 6000);

    // the window: no Windows frame, the menu's size (the game's window does the same) — zns_window.py
    const win = (action, extra) => fetch('/api/window', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, ...(extra || {}) }) }).then((r) => r.json()).then((j) => !!j.ok).catch(() => false);
    (async () => {
        for (let i = 0; i < 3; i++) {
            if (i) await new Promise((r) => setTimeout(r, 600));
            if (await win('frameless', { width: 1180, height: 780, innerWidth: innerWidth, innerHeight: innerHeight, dpr: devicePixelRatio || 1 })) break;
        }
    })();
    // drag the window by this bar (the mouse's way is sent; screen coordinates do not move with the window)
    (() => {
        const bar = document.body;
        let last = null, dx = 0, dy = 0, busy = false;
        const flush = async () => {
            if (busy || (!dx && !dy)) return;
            busy = true;
            const step = { dx, dy, dpr: devicePixelRatio || 1 };
            dx = 0; dy = 0;
            await win('moveby', step);
            busy = false;
            flush();
        };
        bar.addEventListener('pointerdown', (e) => {
            if (e.button !== 0 || e.target.closest('button, input, a, pre, .card')) return;
            last = { x: e.screenX, y: e.screenY };
            bar.setPointerCapture(e.pointerId);
            bar.classList.add('dragging');
        });
        bar.addEventListener('pointermove', (e) => {
            if (!last) return;
            dx += e.screenX - last.x; dy += e.screenY - last.y;
            last = { x: e.screenX, y: e.screenY };
            flush();
        });
        const stop = () => { last = null; bar.classList.remove('dragging'); };
        bar.addEventListener('pointerup', stop);
        bar.addEventListener('lostpointercapture', stop);
    })();
    $('win-min').onclick = () => win('minimize');
    $('win-close').onclick = async () => { if (!(await win('close'))) window.close(); };

    // while this window is open the launcher keeps running
    try { new EventSource('/__launcher/alive'); } catch (e) { /* (old browser) */ }

    const post = (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }).then((r) => r.json());
    let folderShown = false;
    let leaving = false;

    function render(s) {
        $('title').textContent = s.title || '';
        $('folder').hidden = !s.need_folder;
        $('work').hidden = !!s.need_folder || !!s.error;
        $('error').hidden = !s.error;
        $('error-text').textContent = s.error || '';
        if (s.need_folder && !folderShown) {
            folderShown = true;
            $('folder-path').value = s.default_folder || '';
        }
        $('folder-err').textContent = s.folder_error || '';
        const ul = $('steps');
        for (const st of s.steps) {
            // (made once and then only changed: the spinner keeps turning smoothly)
            let li = ul.querySelector(`li[data-step="${st.id}"]`);
            if (!li) {
                li = document.createElement('li');
                li.dataset.step = st.id;
                li.innerHTML = '<span class="ic"></span><span class="t"></span><span class="note"></span>';
                ul.appendChild(li);
            }
            if (li.className !== st.state) li.className = st.state;
            li.children[0].textContent = ICON[st.state] || '';
            li.children[1].textContent = st.title;
            li.children[2].textContent = st.note || '';
        }
        const bar = $('bar');
        const p = typeof s.progress === 'number' ? s.progress : null;
        bar.classList.toggle('indet', p === null);
        bar.firstElementChild.style.width = p === null ? '' : Math.round(p * 100) + '%';
        $('detail').textContent = s.detail || '';
        if (s.done && !leaving) {
            leaving = true;
            // the game now answers on this same address: open it in this window
            setTimeout(() => location.replace('/'), 400);
        }
    }

    async function poll() {
        try {
            const r = await fetch('/__launcher/status', { cache: 'no-store' });
            if (r.ok) render(await r.json());
        } catch (e) { /* the launcher is busy for a moment */ }
        if (!leaving) setTimeout(poll, 350);
    }
    poll();

    $('browse').onclick = async () => {
        const r = await post('/__launcher/browse', { path: $('folder-path').value });
        if (r.path) $('folder-path').value = r.path;
    };
    $('install').onclick = async () => {
        $('folder-err').textContent = '';
        const r = await post('/__launcher/folder', { path: $('folder-path').value });
        if (r.status) render(r.status);
    };
    $('retry').onclick = () => { $('log').hidden = true; post('/__launcher/retry'); };
    $('show-log').onclick = async () => {
        const pre = $('log');
        pre.textContent = await (await fetch('/__launcher/log', { cache: 'no-store' })).text();
        pre.hidden = false;
        pre.scrollTop = pre.scrollHeight;
    };
})();
</script>
</body>
</html>
