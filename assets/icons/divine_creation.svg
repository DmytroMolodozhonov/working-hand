<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="dcr-bg" cx="50%" cy="46%" r="52%"><stop offset="0" stop-color="#fff8dc" stop-opacity=".85"/><stop offset=".5" stop-color="#e8bd52" stop-opacity=".35"/><stop offset="1" stop-color="#2e2108" stop-opacity="0"/></radialGradient>
    <radialGradient id="dcr-seed" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#fff2bf"/><stop offset=".7" stop-color="#ffd25e" stop-opacity=".75"/><stop offset="1" stop-color="#ffb300" stop-opacity="0"/></radialGradient>
    <linearGradient id="dcr-stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4efe4"/><stop offset="1" stop-color="#b9b2a3"/></linearGradient>
    <linearGradient id="dcr-roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d7fd6"/><stop offset="1" stop-color="#2c4590"/></linearGradient>
  </defs>
  <circle cx="64" cy="60" r="60" fill="url(#dcr-bg)"/>
  <!-- rays of the gods' light -->
  <g stroke="#ffe08a" stroke-linecap="round" opacity=".7">
    <path d="M64 4 v12 M64 4 v12" stroke-width="3"/>
    <path d="M30 12 l6 10 M98 12 l-6 10 M10 36 l11 5 M118 36 l-11 5" stroke-width="2.4"/>
    <path d="M44 6 l3 9 M84 6 l-3 9 M18 22 l8 7 M110 22 l-8 7" stroke-width="1.6" opacity=".7"/>
  </g>
  <!-- the runes' ring on the ground -->
  <ellipse cx="64" cy="108" rx="54" ry="11" fill="none" stroke="#ffd25e" stroke-width="2.4" stroke-dasharray="7 4 2 4" opacity=".9"/>
  <ellipse cx="64" cy="108" rx="40" ry="7.5" fill="none" stroke="#c9a8ff" stroke-width="1.6" stroke-dasharray="3 3" opacity=".9"/>
  <!-- a castle rising out of the light: walls, three towers with spires, a gate -->
  <path d="M26 106 V74 h8 v-5 h5 v5 h6 v-5 h5 v5 h28 v-5 h5 v5 h6 v-5 h5 v5 h8 V106 Z" fill="url(#dcr-stone)" stroke="#6f6857" stroke-width="2" stroke-linejoin="round"/>
  <rect x="20" y="62" width="14" height="44" fill="url(#dcr-stone)" stroke="#6f6857" stroke-width="2"/>
  <rect x="94" y="62" width="14" height="44" fill="url(#dcr-stone)" stroke="#6f6857" stroke-width="2"/>
  <rect x="55" y="52" width="18" height="54" fill="url(#dcr-stone)" stroke="#6f6857" stroke-width="2"/>
  <path d="M18 62 L27 40 L36 62 Z M92 62 L101 40 L110 62 Z" fill="url(#dcr-roof)" stroke="#1f2f66" stroke-width="2" stroke-linejoin="round"/>
  <path d="M52 52 L64 24 L76 52 Z" fill="url(#dcr-roof)" stroke="#1f2f66" stroke-width="2" stroke-linejoin="round"/>
  <path d="M27 40 v-5 M101 40 v-5 M64 24 v-6" stroke="#f2c43c" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M57 106 v-14 a7 7 0 0 1 14 0 v14 Z" fill="#5a3a1c" stroke="#3a2410" stroke-width="2"/>
  <path d="M61 64 v7 M67 64 v7 M25 72 v6 M29 72 v6 M99 72 v6 M103 72 v6" stroke="#4a4a52" stroke-width="2.2" stroke-linecap="round"/>
  <!-- the blocks still flying in -->
  <g stroke="#6f6857" stroke-width="1.2">
    <rect x="12" y="44" width="6" height="6" fill="#efe9dc" transform="rotate(-18 15 47)"/>
    <rect x="108" y="48" width="6" height="6" fill="#efe9dc" transform="rotate(22 111 51)"/>
    <rect x="40" y="30" width="5" height="5" fill="#5d7fd6" transform="rotate(12 42 32)"/>
    <rect x="84" y="28" width="5" height="5" fill="#efe9dc" transform="rotate(-25 86 30)"/>
  </g>
  <!-- the seed of light over it all -->
  <circle cx="64" cy="20" r="14" fill="url(#dcr-seed)"/>
  <circle cx="64" cy="20" r="4.5" fill="#fff"/>
  <!-- a small winged creature of one's own, born of the light -->
  <g transform="translate(96 22)">
    <path d="M0 6 q-10 -12 -16 -4 q6 2 8 8 Z M2 6 q10 -12 16 -4 q-6 2 -8 8 Z" fill="#b48cff" stroke="#5a3a9c" stroke-width="1.4" stroke-linejoin="round"/>
    <ellipse cx="1" cy="9" rx="5" ry="6" fill="#ffcf6a" stroke="#8a5a14" stroke-width="1.4"/>
    <circle cx="-1" cy="7" r="2.2" fill="#fff"/><circle cx="3.4" cy="7" r="2.2" fill="#fff"/>
    <circle cx="-1" cy="7.3" r="1" fill="#222"/><circle cx="3.4" cy="7.3" r="1" fill="#222"/>
  </g>
  <!-- a sprout of a new plant -->
  <path d="M30 106 q-2 -12 4 -18" fill="none" stroke="#3f9d3a" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M33 92 q8 -6 10 2 q-6 4 -10 -2 Z" fill="#5ccf5a" stroke="#2b6e28" stroke-width="1.2"/>
  <circle cx="34" cy="87" r="3" fill="#7ad7ff"/>
</svg>
