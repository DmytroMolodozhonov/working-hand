<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f1a2e"/><stop offset="1" stop-color="#0d0a14"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fffbe6" stop-opacity=".95"/><stop offset=".55" stop-color="#ffe9a8" stop-opacity=".55"/><stop offset="1" stop-color="#bfe9ff" stop-opacity="0"/></linearGradient>
    <radialGradient id="tip" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#fff3c4" stop-opacity=".8"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- the cone of light going out of the wand -->
  <path d="M10 44 L58 14 L60 46 Z" fill="url(#beam)"/>
  <path d="M10 44 L58 22" stroke="#fff" stroke-width=".8" opacity=".6"/><path d="M10 44 L59 31" stroke="#fff" stroke-width=".8" opacity=".5"/><path d="M10 44 L59 40" stroke="#fff" stroke-width=".8" opacity=".4"/>
  <!-- the wand -->
  <path d="M5 52 L13 42" stroke="#caa56a" stroke-width="3" stroke-linecap="round"/><path d="M5 52 L8 48.4" stroke="#6b4a2a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="12" cy="43.5" r="6" fill="url(#tip)"/>
  <!-- a dark thing falling to pieces in the light: shards and dust -->
  <g fill="#2b2433" stroke="#8a7aa8" stroke-width=".8" stroke-linejoin="round">
    <path d="M42 24 l6-4 3 5-5 4z"/><path d="M47 33 l5-3 4 4-5 3z"/><path d="M38 36 l4-3 2 4-4 2z"/><path d="M52 22 l3-2 2 3-3 2z"/>
  </g>
  <g fill="#fff3c4"><circle cx="45" cy="30" r="1"/><circle cx="53" cy="27" r="1.2"/><circle cx="41" cy="30" r=".8"/><circle cx="56" cy="37" r="1"/><circle cx="49" cy="40" r=".9"/><circle cx="36" cy="28" r=".7"/><circle cx="58" cy="30" r=".7"/></g>
  <path d="M46 12l1 3 3 1-3 1-1 3-1-3-3-1 3-1z" fill="#fff" opacity=".9"/>
</svg>
