<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="vg-wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8d8a86"/><stop offset=".5" stop-color="#6d6a68"/><stop offset="1" stop-color="#4c4a4b"/></linearGradient>
    <radialGradient id="vg-hole" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e9f6ff" stop-opacity="1"/><stop offset=".55" stop-color="#bcdcf5" stop-opacity=".96"/><stop offset=".85" stop-color="#9cc3e6" stop-opacity=".55"/><stop offset="1" stop-color="#9cc3e6" stop-opacity="0"/></radialGradient>
    <radialGradient id="vg-glow" cx=".5" cy=".5" r=".5"><stop offset=".6" stop-color="#cfe9ff" stop-opacity="0"/><stop offset=".86" stop-color="#e3f3ff" stop-opacity=".75"/><stop offset="1" stop-color="#e3f3ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="vg-fig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b5a7e" stop-opacity=".9"/><stop offset="1" stop-color="#4f6d92" stop-opacity=".55"/></linearGradient>
    <filter id="vg-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>
  <!-- the wall: courses of stone with joints, a lighter top edge and a dark bottom one -->
  <rect x="4" y="12" width="120" height="104" rx="6" fill="url(#vg-wall)" stroke="#2e2c2d" stroke-width="3"/>
  <g stroke="#2e2c2d" stroke-width="2" stroke-linecap="round" opacity=".62" fill="none">
    <path d="M6 32 H122 M6 52 H122 M6 72 H122 M6 92 H122"/>
    <path d="M30 14 V30 M78 14 V30 M104 14 V30 M18 34 V50 M58 34 V50 M98 34 V50 M34 54 V70 M82 54 V70 M116 54 V70 M20 74 V90 M60 74 V90 M104 74 V90 M32 94 V114 M76 94 V114 M110 94 V114"/>
  </g>
  <g fill="#b3afa9" opacity=".28"><path d="M8 14 H120 V17 H8 Z"/><path d="M10 36 H46 V38 H10 Z M64 56 H96 V58 H64 Z M12 76 H40 V78 H12 Z"/></g>
  <g fill="#1d1c1d" opacity=".25"><path d="M8 112 H120 V115 H8 Z"/></g>
  <!-- the cloud: a misty round hole in the wall, soft at the rim, clearer in the middle -->
  <circle cx="64" cy="66" r="43" fill="url(#vg-glow)"/>
  <circle cx="64" cy="66" r="36" fill="url(#vg-hole)"/>
  <g fill="#eaf5ff" opacity=".5" filter="url(#vg-soft)">
    <circle cx="36" cy="58" r="9"/><circle cx="44" cy="40" r="8"/><circle cx="64" cy="31" r="9"/><circle cx="86" cy="39" r="8"/><circle cx="95" cy="58" r="9"/>
    <circle cx="93" cy="80" r="8"/><circle cx="76" cy="95" r="9"/><circle cx="52" cy="95" r="8"/><circle cx="35" cy="80" r="8"/>
  </g>
  <!-- what is behind the wall: a knight on guard and a window, as seen through mist -->
  <g filter="url(#vg-soft)">
    <rect x="76" y="46" width="12" height="17" rx="5" fill="#6f95bf" opacity=".6"/>
    <path d="M82 46 V63 M76 54.5 H88" stroke="#e6f2ff" stroke-width="1.4" opacity=".7"/>
  </g>
  <g fill="url(#vg-fig)" filter="url(#vg-soft)">
    <circle cx="55" cy="55" r="6.5"/>
    <path d="M44 88 C44 71 48 64 55 64 C62 64 66 71 66 88 Z"/>
    <path d="M69 57 L71 88 M71 51 L75 55 L71 78" stroke="#41607f" stroke-width="2" opacity=".55" fill="none" stroke-linecap="round"/>
  </g>
  <path d="M51 53 H59 M55 53 V57" stroke="#dcecff" stroke-width="1.3" opacity=".75" stroke-linecap="round"/>
  <!-- sparkles drifting in the cloud and an eye opening at its edge -->
  <g fill="#ffffff">
    <path transform="translate(97 30)" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/>
    <path transform="translate(28 36) scale(.7)" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/>
    <path transform="translate(100 98) scale(.6)" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/>
    <circle cx="70" cy="40" r="1.6"/><circle cx="46" cy="76" r="1.4"/><circle cx="86" cy="76" r="1.5"/>
  </g>
  <g transform="translate(22 100)">
    <path d="M-13 0 C-7 -9 7 -9 13 0 C7 9 -7 9 -13 0 Z" fill="#f4faff" stroke="#355a80" stroke-width="2.2" stroke-linejoin="round"/>
    <circle r="5" fill="#5b9ad6"/><circle r="2.3" fill="#12273d"/><circle cx="1.7" cy="-1.7" r="1.1" fill="#fff"/>
  </g>
</svg>
