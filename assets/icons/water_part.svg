<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="wp-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d3a72"/><stop offset=".6" stop-color="#5aa0d4"/><stop offset="1" stop-color="#d8f2fc"/></linearGradient>
    <linearGradient id="wp-wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b3f78"/><stop offset=".6" stop-color="#1f86c8"/><stop offset="1" stop-color="#7fd0f0"/></linearGradient>
    <linearGradient id="wp-wallr" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#0b3f78"/><stop offset=".6" stop-color="#1f86c8"/><stop offset="1" stop-color="#7fd0f0"/></linearGradient>
    <linearGradient id="wp-bed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c38a"/><stop offset="1" stop-color="#8a6e3c"/></linearGradient>
    <radialGradient id="wp-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#cdf3ff" stop-opacity=".4"/><stop offset="1" stop-color="#9fe0ff" stop-opacity="0"/></radialGradient>
    <clipPath id="wp-clip"><rect x="4" y="4" width="120" height="120" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#wp-clip)">
    <rect x="4" y="4" width="120" height="120" fill="url(#wp-sky)"/>
    <circle cx="64" cy="40" r="34" fill="url(#wp-glow)"/>
    <!-- the sea at the horizon -->
    <rect x="4" y="52" width="120" height="14" fill="#2b7fc0"/>
    <!-- the dry bed between two walls of water, narrowing into the distance -->
    <polygon points="4,124 4,60 54,56 74,56 124,60 124,124" fill="#0f4f8c"/>
    <polygon points="44,124 56,58 72,58 84,124" fill="url(#wp-bed)"/>
    <path d="M44 124 L56 58 L52 58 Q30 62 4 70 L4 124 Z" fill="url(#wp-wall)"/>
    <path d="M84 124 L72 58 L76 58 Q98 62 124 70 L124 124 Z" fill="url(#wp-wallr)"/>
    <!-- foam along the walls and curling crests -->
    <path d="M52 58 Q36 58 20 66 Q34 62 46 64 Q50 60 56 58 Z" fill="#fff" opacity=".85"/>
    <path d="M76 58 Q92 58 108 66 Q94 62 82 64 Q78 60 72 58 Z" fill="#fff" opacity=".85"/>
    <g fill="none" stroke="#e8fbff" stroke-width="1.6" stroke-linecap="round" opacity=".7">
      <path d="M14 86 Q26 80 38 90"/><path d="M10 104 Q24 97 40 108"/><path d="M114 86 Q102 80 90 90"/><path d="M118 104 Q104 97 88 108"/>
    </g>
    <!-- pebbles and a wand at the front -->
    <g fill="#6e5530" opacity=".7"><ellipse cx="58" cy="108" rx="3" ry="1.6"/><ellipse cx="68" cy="100" rx="2.4" ry="1.2"/><ellipse cx="62" cy="90" rx="1.8" ry="1"/></g>
    <g transform="rotate(-18 64 100)"><rect x="62.4" y="76" width="3.2" height="40" rx="1.6" fill="#5e3a20"/><circle cx="64" cy="76" r="3.4" fill="#fff"/><circle cx="64" cy="76" r="7" fill="url(#wp-glow)"/></g>
  </g>
  <rect x="4" y="4" width="120" height="120" rx="14" fill="none" stroke="#0b2a50" stroke-width="2"/>
</svg>
