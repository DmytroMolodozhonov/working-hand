<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="ax-bg" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#2a1f58"/><stop offset="0.6" stop-color="#0f0a26"/><stop offset="1" stop-color="#05030f"/></radialGradient>
    <linearGradient id="ax-axis" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c8" stop-opacity="0"/><stop offset="0.5" stop-color="#ffe9a0"/><stop offset="1" stop-color="#fff3c8" stop-opacity="0"/></linearGradient>
    <radialGradient id="ax-planet" cx="0.38" cy="0.35" r="0.75"><stop offset="0" stop-color="#8fb8ff"/><stop offset="0.55" stop-color="#3a62c4"/><stop offset="1" stop-color="#101a48"/></radialGradient>
    <clipPath id="ax-clip"><circle cx="64" cy="64" r="60"/></clipPath>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#ax-bg)"/>
  <g clip-path="url(#ax-clip)">
    <!-- star trails wheeling round the axis -->
    <g fill="none" stroke="#cfc4ff" stroke-linecap="round" opacity="0.8">
      <path d="M14 40 A52 52 0 0 1 64 12" stroke-width="1.4"/><path d="M8 52 A60 60 0 0 1 40 10" stroke-width="1.1"/><path d="M114 88 A52 52 0 0 1 64 116" stroke-width="1.4"/><path d="M120 76 A60 60 0 0 1 88 118" stroke-width="1.1"/>
      <path d="M26 84 A40 40 0 0 0 64 104" stroke-width="1.2"/><path d="M102 44 A40 40 0 0 0 64 24" stroke-width="1.2"/><path d="M22 28 A56 56 0 0 1 56 8" stroke-width="0.9"/><path d="M106 100 A56 56 0 0 1 72 120" stroke-width="0.9"/>
    </g>
    <g fill="#fff"><circle cx="20" cy="22" r="1.3"/><circle cx="104" cy="30" r="1.1"/><circle cx="30" cy="108" r="1.2"/><circle cx="100" cy="106" r="1.4"/><circle cx="56" cy="14" r="1"/><circle cx="72" cy="116" r="1"/></g>
    <!-- the planet, tilted, with a lit crescent (day) and a dark side (night) -->
    <g transform="rotate(-23 64 64)">
      <circle cx="64" cy="64" r="28" fill="url(#ax-planet)"/>
      <path d="M64 36 A28 28 0 0 1 64 92 A20 28 0 0 0 64 36 Z" fill="#06081c" opacity="0.7"/>
      <path d="M44 56 q10 -4 18 2 M42 70 q12 4 24 -2" fill="none" stroke="#b8d4ff" stroke-width="1.6" opacity="0.5"/>
      <!-- the axis through the poles -->
      <rect x="62.6" y="6" width="2.8" height="116" fill="url(#ax-axis)"/>
      <circle cx="64" cy="8" r="3" fill="#fff6c8"/><circle cx="64" cy="120" r="3" fill="#fff6c8"/>
    </g>
    <!-- an arrow of the turning -->
    <path d="M92 40 A36 36 0 0 1 98 82" fill="none" stroke="#ffe08a" stroke-width="3" stroke-linecap="round"/>
    <path d="M92 86 L98 82 L104 88" fill="none" stroke="#ffe08a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="64" cy="64" r="60" fill="none" stroke="#b9a6ff" stroke-width="2"/>
</svg>
